<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020812">
  <meta name="description" content="STEWFACE.DEV — Development & Support Infrastructure. Public technical services and product resources.">
  <title>STEWFACE.DEV</title>
  <style>
    :root { color-scheme: dark; background: #020812; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #020812;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
    }
    .hero {
      position: fixed;
      inset: 0;
      background: #020812;
      overflow: hidden;
    }
    .hero__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      transition: opacity 450ms ease-out;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hero__image.is-ready { opacity: 1; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-aspect-ratio: 4/5) {
      .hero__image {
        object-fit: cover;
        object-position: 50% 50%;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero__image { transition: none; }
    }
  </style>
</head>
<body>
  <main class="hero" role="img" aria-label="STEWFACE.DEV — Development & Support Infrastructure">
    <img id="hero-image" class="hero__image" alt="" aria-hidden="true">
    <div class="sr-only">
      <h1>STEWFACE.DEV</h1>
      <p>Development &amp; Support Infrastructure</p>
      <p>Public technical services and product resources.</p>
    </div>
  </main>
  <script>
    (() => {
      const parts = [
        "/assets/hero/part-0.b64?v=2",
        "/assets/hero/part-1.b64?v=2",
        "/assets/hero/part-2.b64?v=2",
        "/assets/hero/part-3.b64?v=2"
      ];

      Promise.all(parts.map(async (path) => {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Hero asset request failed: " + path + " (" + response.status + ")");
        }
        return (await response.text()).trim();
      }))
      .then((chunks) => {
        const image = document.getElementById("hero-image");
        image.addEventListener("load", () => image.classList.add("is-ready"), { once: true });
        image.src = "data:image/webp;base64," + chunks.join("");
      })
      .catch((error) => {
        console.error("STEWFACE.DEV hero failed to load.", error);
      });
    })();
  </script>
</body>
</html>
